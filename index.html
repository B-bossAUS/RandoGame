<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rando Dash</title>
<style>
  :root {
    --bg: #0f1020;
    --panel: #1b1d36;
    --text: #e8e8f5;
    --muted: #8a8cb0;
    --accent: #6ee7b7;
    --danger: #f87171;
    --gold: #fbbf24;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    user-select: none;
  }
  h1 { margin: 0 0 8px; font-size: 1.6rem; letter-spacing: 0.04em; }
  #hud {
    width: 100%;
    max-width: 480px;
    display: flex;
    justify-content: space-between;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    margin-bottom: 6px;
    font-size: 0.95rem;
  }
  #hud b { color: var(--text); }
  #wrap { position: relative; width: 100%; max-width: 480px; }
  canvas {
    display: block;
    width: 100%;
    aspect-ratio: 3 / 4;
    background: var(--panel);
    border-radius: 12px;
    touch-action: none;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    background: rgba(15, 16, 32, 0.82);
    border-radius: 12px;
  }
  #overlay.hidden { display: none; }
  #overlay h2 { margin: 0 0 8px; font-size: 1.5rem; }
  #overlay p { margin: 4px 0; color: var(--muted); line-height: 1.4; }
  button {
    margin-top: 16px;
    font: inherit;
    font-weight: 600;
    padding: 10px 28px;
    border: 0;
    border-radius: 999px;
    background: var(--accent);
    color: #0f1020;
    cursor: pointer;
  }
  #modifier {
    min-height: 1.4em;
    margin-top: 8px;
    color: var(--gold);
    font-weight: 600;
    text-align: center;
  }
</style>
</head>
<body>
<h1>Rando Dash</h1>
<div id="hud">
  <span>Score <b id="score">0</b></span>
  <span>Lives <b id="lives">3</b></span>
  <span>Best <b id="best">0</b></span>
</div>
<div id="wrap">
  <canvas id="game" width="480" height="640"></canvas>
  <div id="overlay">
    <h2>Rando Dash</h2>
    <p>Dodge the <span style="color:var(--danger)">red spikes</span>, grab the <span style="color:var(--gold)">gold coins</span>.</p>
    <p>Every 10 seconds a random chaos modifier changes the rules.</p>
    <p>Move: ← → / A D, or drag on the screen.</p>
    <button id="start">Play</button>
  </div>
</div>
<div id="modifier"></div>

<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  const $ = id => document.getElementById(id);
  const overlay = $("overlay"), startBtn = $("start");

  const MODIFIERS = [
    { name: "Speed Frenzy", desc: "Everything falls twice as fast", apply: s => { s.fallMul = 2; } },
    { name: "Reversed Controls", desc: "Left is right, right is left", apply: s => { s.reverse = true; } },
    { name: "Tiny Mode", desc: "You shrink to half size", apply: s => { s.sizeMul = 0.5; } },
    { name: "Giant Mode", desc: "You grow huge", apply: s => { s.sizeMul = 1.8; } },
    { name: "Coin Rain", desc: "Coins everywhere, worth double", apply: s => { s.coinChance = 0.7; s.coinValue = 2; } },
    { name: "Gravity Flip", desc: "Stuff falls upward", apply: s => { s.flip = true; } },
    { name: "Slow Motion", desc: "The world slows down", apply: s => { s.fallMul = 0.5; } },
    { name: "Blackout", desc: "You can only see near yourself", apply: s => { s.dark = true; } },
    { name: "Slippery Floor", desc: "Movement has momentum", apply: s => { s.slippery = true; } },
    { name: "Calm", desc: "No modifier — enjoy it while it lasts", apply: () => {} },
  ];
  const MODIFIER_SECONDS = 10;

  let best = 0;
  try { best = Number(localStorage.getItem("randodash-best")) || 0; } catch (e) {}
  $("best").textContent = best;

  let state, keys = {}, pointerX = null, lastTime = 0, running = false;

  function baseRules() {
    return { fallMul: 1, reverse: false, sizeMul: 1, coinChance: 0.25, coinValue: 1,
             flip: false, dark: false, slippery: false };
  }

  function reset() {
    state = {
      player: { x: W / 2, vx: 0, size: 36 },
      items: [],
      score: 0,
      lives: 3,
      time: 0,
      spawnTimer: 0,
      modTimer: 0,
      modifier: MODIFIERS[MODIFIERS.length - 1],
      rules: baseRules(),
      invuln: 0,
      particles: [],
    };
    setModifier(MODIFIERS[MODIFIERS.length - 1]);
    updateHud();
  }

  function setModifier(mod) {
    state.modifier = mod;
    state.rules = baseRules();
    mod.apply(state.rules);
    $("modifier").textContent = `⚡ ${mod.name}: ${mod.desc}`;
  }

  function randomModifier() {
    let next;
    do { next = MODIFIERS[Math.floor(Math.random() * MODIFIERS.length)]; }
    while (next === state.modifier);
    setModifier(next);
  }

  function updateHud() {
    $("score").textContent = state.score;
    $("lives").textContent = state.lives;
  }

  function spawn() {
    const r = state.rules;
    const isCoin = Math.random() < r.coinChance;
    const size = isCoin ? 18 : 16 + Math.random() * 22;
    // Hazards get faster as the run goes on.
    const speed = (140 + Math.random() * 120 + state.time * 4);
    state.items.push({
      x: size + Math.random() * (W - size * 2),
      y: r.flip ? H + size : -size,
      size, speed, coin: isCoin,
      spin: Math.random() * Math.PI * 2,
    });
  }

  function burst(x, y, color) {
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 160;
      state.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.6, color });
    }
  }

  function update(dt) {
    const r = state.rules, p = state.player;
    state.time += dt;

    state.modTimer += dt;
    if (state.modTimer >= MODIFIER_SECONDS) {
      state.modTimer = 0;
      randomModifier();
    }

    // Input: keyboard or pointer drag.
    let dir = 0;
    if (keys.ArrowLeft || keys.a) dir -= 1;
    if (keys.ArrowRight || keys.d) dir += 1;
    if (r.reverse) dir = -dir;
    const speed = 340;
    if (pointerX !== null) {
      const target = r.reverse ? W - pointerX : pointerX;
      dir = Math.max(-1, Math.min(1, (target - p.x) / 40));
    }
    if (r.slippery) {
      p.vx += dir * speed * 3 * dt;
      p.vx *= Math.pow(0.35, dt);
    } else {
      p.vx = dir * speed;
    }
    const size = p.size * r.sizeMul;
    p.x = Math.max(size / 2, Math.min(W - size / 2, p.x + p.vx * dt));
    const py = r.flip ? 60 : H - 60;

    // Spawning gets more frequent over time.
    state.spawnTimer -= dt;
    if (state.spawnTimer <= 0) {
      spawn();
      state.spawnTimer = Math.max(0.18, 0.7 - state.time * 0.008);
    }

    if (state.invuln > 0) state.invuln -= dt;

    for (const it of state.items) {
      it.y += (r.flip ? -1 : 1) * it.speed * r.fallMul * dt;
      it.spin += dt * 3;
      const hit = Math.abs(it.x - p.x) < (size + it.size) / 2 &&
                  Math.abs(it.y - py) < (size + it.size) / 2;
      if (!hit) continue;
      if (it.coin) {
        state.score += 10 * r.coinValue;
        burst(it.x, it.y, "#fbbf24");
        it.dead = true;
      } else if (state.invuln <= 0) {
        state.lives -= 1;
        state.invuln = 1.2;
        burst(p.x, py, "#f87171");
        it.dead = true;
      }
    }
    state.items = state.items.filter(it => !it.dead && it.y > -60 && it.y < H + 60);

    for (const pt of state.particles) {
      pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.life -= dt;
    }
    state.particles = state.particles.filter(pt => pt.life > 0);

    // Survival points.
    state.score += Math.floor(state.time) > Math.floor(state.time - dt) ? 1 : 0;
    updateHud();

    if (state.lives <= 0) gameOver();
  }

  function draw() {
    const r = state.rules, p = state.player;
    ctx.clearRect(0, 0, W, H);

    // Modifier countdown bar.
    ctx.fillStyle = "rgba(251,191,36,0.25)";
    ctx.fillRect(0, 0, W * (1 - state.modTimer / MODIFIER_SECONDS), 4);

    for (const it of state.items) {
      ctx.save();
      ctx.translate(it.x, it.y);
      if (it.coin) {
        ctx.fillStyle = "#fbbf24";
        ctx.beginPath();
        ctx.ellipse(0, 0, it.size / 2 * Math.abs(Math.cos(it.spin)) + 2, it.size / 2, 0, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.rotate(it.spin);
        ctx.fillStyle = "#f87171";
        ctx.beginPath();
        const n = 4, R = it.size / 2;
        for (let i = 0; i < n * 2; i++) {
          const rad = i % 2 ? R * 0.45 : R;
          const a = (i / (n * 2)) * Math.PI * 2;
          ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
        }
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

    const size = p.size * r.sizeMul;
    const py = r.flip ? 60 : H - 60;
    const blink = state.invuln > 0 && Math.floor(state.invuln * 10) % 2 === 0;
    if (!blink) {
      ctx.fillStyle = "#6ee7b7";
      ctx.beginPath();
      ctx.roundRect(p.x - size / 2, py - size / 2, size, size, size * 0.2);
      ctx.fill();
      ctx.fillStyle = "#0f1020";
      const eye = size * 0.12;
      ctx.fillRect(p.x - size * 0.22, py - size * 0.12, eye, eye);
      ctx.fillRect(p.x + size * 0.1, py - size * 0.12, eye, eye);
    }

    for (const pt of state.particles) {
      ctx.globalAlpha = Math.max(0, pt.life / 0.6);
      ctx.fillStyle = pt.color;
      ctx.fillRect(pt.x - 2, pt.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    if (r.dark) {
      const g = ctx.createRadialGradient(p.x, py, 40, p.x, py, 170);
      g.addColorStop(0, "rgba(0,0,0,0)");
      g.addColorStop(1, "rgba(0,0,0,0.97)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }
  }

  function loop(t) {
    if (!running) return;
    const dt = Math.min(0.05, (t - lastTime) / 1000);
    lastTime = t;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function start() {
    reset();
    overlay.classList.add("hidden");
    running = true;
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  function gameOver() {
    running = false;
    const newBest = state.score > best;
    if (newBest) {
      best = state.score;
      try { localStorage.setItem("randodash-best", String(best)); } catch (e) {}
      $("best").textContent = best;
    }
    overlay.innerHTML = `
      <h2>Game over</h2>
      <p>Score: <b style="color:var(--text)">${state.score}</b>${newBest ? " — new best!" : ""}</p>
      <p>Survived ${Math.floor(state.time)}s. Last modifier: ${state.modifier.name}</p>
      <button id="again">Play again</button>`;
    overlay.classList.remove("hidden");
    $("again").addEventListener("click", start);
  }

  window.addEventListener("keydown", e => {
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    keys[k] = true;
    if ((k === " " || k === "Enter") && !running) start();
    if (k.startsWith("Arrow")) e.preventDefault();
  });
  window.addEventListener("keyup", e => {
    keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false;
  });

  function toCanvasX(e) {
    const rect = canvas.getBoundingClientRect();
    return (e.clientX - rect.left) * (W / rect.width);
  }
  canvas.addEventListener("pointerdown", e => { pointerX = toCanvasX(e); canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener("pointermove", e => { if (pointerX !== null) pointerX = toCanvasX(e); });
  const release = () => { pointerX = null; };
  canvas.addEventListener("pointerup", release);
  canvas.addEventListener("pointercancel", release);

  startBtn.addEventListener("click", start);
  reset();
  draw();
})();
</script>
</body>
</html>
